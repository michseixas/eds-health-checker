<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDS Site Health Checker</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <header id="app-header">
    <h1>EDS Site Health Checker</h1>
    <form id="check-form">
      <input
        id="url-input"
        type="url"
        placeholder="https://www.example.aem.live"
        autocomplete="url"
        spellcheck="false"
        required
      >
      <button id="submit-btn" type="submit">Run Checks</button>
    </form>
  </header>

  <main id="dashboard"></main>

  <script type="module" src="scripts/main.js"></script>
</body>
</html>
